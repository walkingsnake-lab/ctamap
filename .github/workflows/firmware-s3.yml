# Builds the S3 firmware (firmware-s3/) the way the Arduino IDE does, without
# secrets.h: the generic build that OTA updates install. Each run keeps an
# artifact (ctaboard-<commit>) with ctaboard.ino.bin, to upload on the
# control page's Board tab, and ctaboard.ino.merged.bin, which
# scripts/setup-board.js flashes onto new boards. Also catches firmware that
# no longer compiles.
#
# On main, `publish` signs the build and puts it on the server's beta
# channel (firmware-s3/README.md, "Signed builds"). It runs in the
# firmware-release environment, which only main can use and which holds
# the signing key and the deploy token; without them it skips, with a warning.
name: S3 firmware

on:
  push:
    branches: [main]
    paths: ['firmware-s3/**', 'scripts/stamp-firmware-version.js', 'scripts/sign-firmware.js', '.github/workflows/firmware-s3.yml']
  pull_request:
    paths: ['firmware-s3/**', 'scripts/stamp-firmware-version.js', 'scripts/sign-firmware.js', '.github/workflows/firmware-s3.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.mark.outputs.version }}
    env:
      # README "Setting up": Adafruit MatrixPortal ESP32-S3, USB CDC On Boot
      # enabled, the default TinyUF2 partitions (two 2 MB app slots for OTA).
      FQBN: esp32:esp32:adafruit_matrixportal_esp32s3:CDCOnBoot=cdc,PartitionScheme=tinyuf2
    steps:
      - uses: actions/checkout@v4
        with:
          # The pushed commit itself (not a PR merge commit), so the stamp
          # names a commit on a branch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: arduino/setup-arduino-cli@v2

      - name: Install the ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "ESP32 HUB75 LED MATRIX PANEL DMA Display" "Adafruit GFX Library"
          arduino-cli core list
          arduino-cli lib list

      - name: "Stamp and build (generic, no secrets.h)"
        run: |
          test ! -e firmware-s3/ctaboard/secrets.h
          node scripts/stamp-firmware-version.js
          arduino-cli compile --fqbn "$FQBN" --warnings default --output-dir build firmware-s3/ctaboard

      - name: Check the build mark the server reads
        id: mark
        run: |
          v=$(sed -n 's/.*FIRMWARE_VERSION "\(.*\)"/\1/p' firmware-s3/ctaboard/version.h)
          grep -a -c "CTABOARD-BUILD:${v}:generic;" build/ctaboard.ino.bin
          ls -l build/ctaboard.ino.bin build/ctaboard.ino.merged.bin
          size=$(stat -c %s build/ctaboard.ino.bin)
          test "$size" -le 2097152
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Built **$v**: ctaboard.ino.bin, $size bytes (app slot: 2097152)." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ctaboard-${{ steps.mark.outputs.version }}
          path: |
            build/ctaboard.ino.bin
            build/ctaboard.ino.merged.bin
          retention-days: 90

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: firmware-release
    env:
      BOARD_URL: https://ctamap.fly.dev
      FIRMWARE_SIGNING_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
      FIRMWARE_DEPLOY_TOKEN: ${{ secrets.FIRMWARE_DEPLOY_TOKEN }}
    steps:
      - name: Check the secrets
        id: ready
        run: |
          if [ -z "$FIRMWARE_SIGNING_KEY" ] || [ -z "$FIRMWARE_DEPLOY_TOKEN" ]; then
            echo "::warning::firmware-release has no signing key or deploy token: not published (run node scripts/firmware-key.js --github)"
            echo "go=0" >> "$GITHUB_OUTPUT"
          else
            echo "go=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == '1'

      - uses: actions/setup-node@v4
        if: steps.ready.outputs.go == '1'
        with:
          node-version: 20

      - uses: actions/download-artifact@v4
        if: steps.ready.outputs.go == '1'
        with:
          name: ctaboard-${{ needs.build.outputs.version }}
          path: build

      - name: Sign (checked against the repo's public key)
        if: steps.ready.outputs.go == '1'
        run: node scripts/sign-firmware.js build/ctaboard.ino.bin

      - uses: actions/upload-artifact@v4
        if: steps.ready.outputs.go == '1'
        with:
          name: ctaboard-${{ needs.build.outputs.version }}-signature
          path: build/ctaboard.ino.bin.sig
          retention-days: 90

      - name: Publish to beta
        if: steps.ready.outputs.go == '1'
        run: |
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST "$BOARD_URL/board/firmware-upload" \
            -H "X-Deploy-Token: $FIRMWARE_DEPLOY_TOKEN" \
            -H "X-Firmware-Signature: $(tr -d '\n' < build/ctaboard.ino.bin.sig)" \
            -H 'Content-Type: application/octet-stream' \
            --data-binary @build/ctaboard.ino.bin)
          cat response.json; echo
          test "$code" = 200
          echo "Published **${{ needs.build.outputs.version }}** to beta." >> "$GITHUB_STEP_SUMMARY"
