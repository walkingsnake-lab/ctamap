<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board Simulator</title>
<style>
  :root { color-scheme: dark; --bg: #0b0b0b; --fg: #d8d8d8; --muted: #8f8f8f; --line: #262626; --accent: #ffb000; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 12px; }
  .screens { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  figure { margin: 0; }
  figcaption { color: var(--muted); font-size: 12px; margin-bottom: 6px; display: flex; justify-content: space-between; gap: 8px; }
  figure.active figcaption span:first-child { color: var(--accent); }
  canvas { width: 100%; aspect-ratio: 2 / 1; display: block; border: 1px solid var(--line); border-radius: 6px; background: #080808; }
  figure.active canvas { border-color: #4a3a10; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 16px 0; color: var(--muted); font-size: 12px; }
  .bar b { color: var(--fg); font-weight: 600; }
  .err { color: #ff6b6b; }
  details { margin-top: 8px; }
  summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  pre { background: #111; border: 1px solid var(--line); border-radius: 6px; padding: 12px; overflow-x: auto; font-size: 12px; max-height: 50vh; }
  label { display: inline-flex; gap: 6px; align-items: center; }
  .picker { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  select, button { font: inherit; color: var(--fg); background: #161616; border: 1px solid #333; border-radius: 6px; padding: 6px 8px; }
  select { flex: 1 1 260px; max-width: 420px; }
  button { cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  .note { color: var(--muted); font-size: 12px; }
  .tests { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: -6px 0 16px; font-size: 12px; color: var(--muted); }
  .tests .chip { padding: 4px 8px; border-radius: 6px; border: 1px solid #333; background: #161616; color: var(--fg); font: inherit; cursor: pointer; }
  .tests .chip[aria-pressed="true"] { color: #fff; border-color: transparent; }
  .tests select { flex: 0 0 auto; padding: 4px 6px; }
</style>
</head>
<body>
<main>
  <h1>Board simulator</h1>
  <div class="picker">
    <select id="station" aria-label="Station"></select>
    <label><input type="checkbox" id="showHeader"> Header</label>
    <label><input type="checkbox" id="showWeather"> Weather row</label>
    <label><input type="checkbox" id="radarTime"> Radar time</label>
    <select id="logoLayout" aria-label="Baseball layout"><option value="classic">Baseball: classic</option><option value="logos">Baseball: logos</option><option value="bands">Baseball: bands</option></select>
    <button id="apply" disabled>Use on board</button>
    <span class="note" id="previewNote"></span>
  </div>
  <div class="tests" id="tests">
    <span>Test alerts, game, and radar (board too, 10 min):</span>
    <span id="testLines"></span>
    <select id="testWarn" aria-label="Test weather alert">
      <option value="">No weather alert</option>
      <option value="svr:watch">Severe t-storm watch</option>
      <option value="svr:warning">Severe t-storm warning</option>
      <option value="tor:watch">Tornado watch</option>
      <option value="tor:warning">Tornado warning</option>
    </select>
    <select id="testGame" aria-label="Test baseball game">
      <option value="">No test game</option>
      <option value="pre">Cubs game: pregame</option>
      <option value="live">Cubs game: live</option>
      <option value="final">Cubs game: final</option>
    </select>
    <select id="testRadar" aria-label="Test radar">
      <option value="">No test radar</option>
      <option value="storm">Radar: storm (Aug 2020 derecho)</option>
      <option value="snow">Radar: snow (Feb 2022)</option>
    </select>
    <button class="chip" id="testClear">Clear</button>
    <span id="testLeft"></span>
  </div>
  <div class="screens">
    <figure id="fig-transit">
      <figcaption><span>Transit</span></figcaption>
      <canvas id="transit" width="640" height="320" aria-label="Transit screen"></canvas>
    </figure>
    <figure id="fig-weather">
      <figcaption><span>Weather</span><span id="radarState"></span></figcaption>
      <canvas id="weather" width="640" height="320" aria-label="Weather screen"></canvas>
    </figure>
    <figure id="fig-ticker">
      <figcaption><span>Ticker</span><span id="pageState"></span></figcaption>
      <canvas id="ticker" width="640" height="320" aria-label="Ticker screen"></canvas>
    </figure>
    <figure id="fig-baseball">
      <figcaption><span>Baseball</span><span id="gameState"></span></figcaption>
      <canvas id="baseball" width="640" height="320" aria-label="Baseball screen"></canvas>
    </figure>
  </div>
  <div class="bar">
    <span>board <b id="board"></b></span>
    <span>screen <b id="screen">…</b></span>
    <span>view <b id="view">…</b></span>
    <span>v <b id="v">…</b></span>
    <span>data age <b id="age">…</b></span>
    <span>bright <b id="bright">…</b></span>
    <label><input type="checkbox" id="pause"> pause</label>
    <span id="status"></span>
  </div>
  <details>
    <summary>/board/update payload</summary>
    <pre id="json">…</pre>
  </details>
</main>
<script src="draw.js"></script>
<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const board = params.get('b') || 'home';
  $('board').textContent = board;
  const setStatus = (msg) => { $('status').textContent = msg || ''; $('status').className = msg ? 'err' : ''; };

  // ---- draw.js, bound to the board's fonts and icons ----
  const assets = await fetch('sim-assets.json').then((r) => r.json());
  const D = BoardDraw.create(assets);

  // ---- LED canvas: 64x32 pixels scaled up, with a dot grille on top ----
  function ledCanvas(canvas) {
    const S = canvas.width / 64;
    const ctx = canvas.getContext('2d');
    const small = new OffscreenCanvas(64, 32);
    const sctx = small.getContext('2d');
    const img = sctx.createImageData(64, 32);
    // Grille: dark board with round holes; unlit LEDs show as near-black dots.
    const grille = new OffscreenCanvas(canvas.width, canvas.height);
    const g = grille.getContext('2d');
    g.fillStyle = '#080808';
    g.fillRect(0, 0, grille.width, grille.height);
    g.globalCompositeOperation = 'destination-out';
    for (let y = 0; y < 32; y++) for (let x = 0; x < 64; x++) {
      g.beginPath(); g.arc(x * S + S / 2, y * S + S / 2, S * 0.42, 0, Math.PI * 2); g.fill();
    }
    return (frame) => {
      for (let i = 0, j = 0; i < 64 * 32; i++, j += 3) {
        const r = frame.px[j], gg = frame.px[j + 1], b = frame.px[j + 2];
        const lit = r || gg || b;
        img.data[i * 4] = lit ? r : 12;
        img.data[i * 4 + 1] = lit ? gg : 12;
        img.data[i * 4 + 2] = lit ? b : 12;
        img.data[i * 4 + 3] = 255;
      }
      sctx.putImageData(img, 0, 0);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(small, 0, 0, canvas.width, canvas.height);
      ctx.drawImage(grille, 0, 0);
    };
  }
  const paintTransit = ledCanvas($('transit'));
  const paintTicker = ledCanvas($('ticker'));
  const paintWeather = ledCanvas($('weather'));
  const paintBaseball = ledCanvas($('baseball'));

  // Radar frames are immutable: fetch each ID once, keep the ones in use.
  const radarFrames = {};
  async function syncRadarFrames() {
    const ids = (p && p.radar && p.radar.frames) || [];
    for (const id of Object.keys(radarFrames)) if (!ids.includes(id)) delete radarFrames[id];
    for (const id of ids) {
      if (radarFrames[id]) continue;
      const q = query();
      const r = await fetch(`api/radar/${encodeURIComponent(id)}?${q}`);
      if (r.ok) radarFrames[id] = new Uint8Array(await r.arrayBuffer());
    }
  }

  // Team logo crops are immutable too (ids carry a hash): fetch each once.
  const logoBytes = {};
  async function syncLogos() {
    const games = (p && p.mlb && p.mlb.games) || [];
    for (const g of games) for (const sd of [g.away, g.home]) {
      if (!sd.lg || logoBytes[sd.lg]) continue;
      const r = await fetch(`api/logo/${encodeURIComponent(sd.lg)}`);
      if (r.ok) logoBytes[sd.lg] = new Uint8Array(await r.arrayBuffer());
    }
  }

  // ---- payload, with the board's clock sync (now = server now + elapsed) ----
  let p = null, clockOffset = 0, clockSet = false;
  const now = () => Date.now() / 1000 + clockOffset;

  // The board's own settings, and what the simulator is previewing. Preview
  // settings that differ from the board's go to the server as query params
  // and never change the board until "Use on board".
  let boardCfg = null; // { mapid, showHeader, showWeather, radarTime, logoLayout }
  const flag = (v) => (v === '1' ? true : v === '0' ? false : null);
  const prev = { mapid: params.get('mapid'), showHeader: flag(params.get('header')), showWeather: flag(params.get('weather')), radarTime: flag(params.get('rtime')), logoLayout: params.get('bblayout') };
  const FIELDS = ['mapid', 'showHeader', 'showWeather', 'radarTime', 'logoLayout'];
  const QNAME = { mapid: 'mapid', showHeader: 'header', showWeather: 'weather', radarTime: 'rtime', logoLayout: 'bblayout' };
  const changed = () => (boardCfg ? FIELDS.filter((k) => prev[k] != null && prev[k] !== boardCfg[k]) : []);
  const previewing = () => changed().length > 0;
  const query = () => {
    const q = new URLSearchParams({ b: board });
    for (const k of changed()) q.set(QNAME[k], k === 'mapid' || k === 'logoLayout' ? prev[k] : prev[k] ? '1' : '0');
    return q;
  };

  let lastJson = '';
  async function poll() {
    if ($('pause').checked) return;
    try {
      const r = await fetch('api/update?' + query(), { cache: 'no-store' });
      const body = await r.json();
      if (!r.ok) throw new Error(body.err || r.status);
      if (p && body.stn !== p.stn) resetAnimation(); // new station: start fresh, like the board
      p = body;
      // The server's clock is whole seconds; adopt a new offset only on real
      // drift so the clock doesn't jitter by up to a second every poll.
      const off = p.now - Date.now() / 1000;
      if (!clockSet || Math.abs(off - clockOffset) > 1.5) { clockOffset = off; clockSet = true; }
      // Only rewrite the page when the payload changed: a big <pre> rewrite
      // on every poll can hitch the animation (and the alert blink).
      const text = JSON.stringify(p, (k, v) => (k === 'now' || k === 'age' ? undefined : v), 2);
      if (text !== lastJson) { lastJson = text; $('json').textContent = text; }
      $('screen').textContent = D.autoScreen(p, now());
      $('view').textContent = (p.view || 'dest') + (p.hidden && p.hidden.length ? ` (${p.hidden.join(' + ')} hidden to fit)` : '');
      $('v').textContent = p.v;
      $('age').textContent = p.age + ' s';
      $('bright').textContent = p.bright;
      syncRadarFrames().catch(() => {});
      syncLogos().catch(() => {});
      setStatus('');
    } catch (e) {
      setStatus('update failed: ' + e.message);
    }
  }

  // ---- animation state, as the board keeps it ----
  let transitAnim = D.createTransitAnimator();
  let page = 0, pageStart = performance.now();
  let bbShown = null, bbRolls = {};

  function frame(t) {
    if (!p || $('pause').checked) return;
    const n = now();
    // Always drawn at full brightness (the bar still shows the board's level).
    const full = p.bright === 100 ? p : { ...p, bright: 100 };
    const shown = D.autoScreen(p, n);
    if (shown !== lastShown) {
      lastShown = shown;
      $('screen').textContent = shown;
      for (const k of ['transit', 'ticker', 'weather', 'baseball']) $('fig-' + k).classList.toggle('active', shown === k);
    }

    // Transit: rolls, fades, and slides come from the animator.
    const view = transitAnim.step(p, n, t);
    const blink = Math.floor(t / D.BLINK_MS) % 2 === 1;
    paintTransit(D.render(full, { screen: 'transit', now: n, blink, view }));

    // Ticker: hold each page, then slide up to the next, looping.
    const pages = D.tickerPages(p, n);
    if (page >= pages) page = 0;
    let since = t - pageStart;
    const tm = D.timing(p);
    if (since >= tm.pageHold + tm.slide) { page = (page + 1) % pages; pageStart = t; since = 0; }
    const slide = pages > 1 && since > tm.pageHold ? (since - tm.pageHold) / tm.slide : 0;
    paintTicker(D.render(full, { screen: 'ticker', now: n, page, slide }));
    $('pageState').textContent = `page ${page + 1} of ${pages}`;

    // Radar: step through the loop, then hold on the newest frame.
    const nf = (p.radar && p.radar.frames.length) || 0;
    const cycle = Math.max(1, nf - 1) * tm.radarFrame + tm.radarHold;
    const idx = nf ? Math.min(nf - 1, Math.floor((t % cycle) / tm.radarFrame)) : -1;
    paintWeather(D.render(full, { screen: 'weather', now: n, idx, frames: radarFrames, blink }));
    $('radarState').textContent = p.radar && p.radar.on ? (nf ? 'rain in the box: radar' : 'rain in the box, no frames yet') : 'no rain: conditions';

    // Baseball: scores, inning, count, and outs roll when they change, as on
    // the board (not across a change of game or state).
    const bt = D.baseballTexts(p, n);
    if (bt && bbShown && bbShown.key === bt.key) {
      for (const [k, v] of Object.entries(bt.texts)) if (bbShown.texts[k] !== v) bbRolls[k] = { from: bbShown.texts[k], start: t };
    } else bbRolls = {};
    bbShown = bt;
    const rolls = {};
    for (const [k, r] of Object.entries(bbRolls)) {
      const rp = (t - r.start) / D.ROLL_MS;
      if (rp >= 1) delete bbRolls[k]; else rolls[k] = { from: r.from, p: rp };
    }
    paintBaseball(D.render(full, { screen: 'baseball', now: n, rolls, logos: logoBytes }));
    const pick = D.pickGame((p.mlb && p.mlb.games) || [], n, tm.game);
    const anyLive = ((p.mlb && p.mlb.games) || []).some((g) => g.st === 'live');
    $('gameState').textContent = !pick.of ? 'no games' : `${anyLive ? 'live game' : 'game'} ${pick.pos + 1} of ${pick.of}`;
  }

  let lastShown = null;
  let last = 0;
  function loop(t) {
    if (t - last >= 33) { last = t; try { frame(t); } catch (e) { setStatus('draw failed: ' + e.message); } }
    requestAnimationFrame(loop);
  }

  // ---- station picker and transit toggles ----
  function syncPicker() {
    if (!boardCfg) return;
    for (const k of FIELDS) if (prev[k] == null) prev[k] = boardCfg[k];
    $('station').value = prev.mapid || '';
    $('showHeader').checked = prev.showHeader;
    $('showWeather').checked = prev.showWeather;
    $('radarTime').checked = prev.radarTime;
    $('logoLayout').value = prev.logoLayout || 'classic';
    $('apply').disabled = !previewing();
    $('previewNote').textContent = previewing() ? 'Preview only: the board keeps its own settings until you press "Use on board".' : '';
    const q = new URLSearchParams(location.search);
    for (const name of Object.values(QNAME)) q.delete(name);
    for (const [k, v] of query()) if (k !== 'b') q.set(k, v);
    history.replaceState(null, '', '?' + q);
  }

  function resetAnimation() {
    transitAnim = D.createTransitAnimator();
    page = 0; pageStart = performance.now();
  }

  async function loadStations() {
    const [list, state] = await Promise.all([
      fetch('api/stations').then((r) => r.json()),
      fetch('api/state', { cache: 'no-store' }).then((r) => r.json()),
    ]);
    $('station').replaceChildren(...list.map((s) => new Option(s.desc, s.mapid)));
    const b = state.boards && state.boards[board];
    boardCfg = b ? { mapid: b.station.mapid, showHeader: b.showHeader, showWeather: b.showWeather, radarTime: b.radarTime !== false, logoLayout: b.baseballLayout || 'classic' } : null;
    syncPicker();
  }

  const previewChanged = () => { syncPicker(); resetAnimation(); p = null; poll(); };
  $('station').addEventListener('change', (e) => { prev.mapid = e.target.value; previewChanged(); });
  $('showHeader').addEventListener('change', (e) => { prev.showHeader = e.target.checked; previewChanged(); });
  $('showWeather').addEventListener('change', (e) => { prev.showWeather = e.target.checked; previewChanged(); });
  $('radarTime').addEventListener('change', (e) => { prev.radarTime = e.target.checked; previewChanged(); });
  $('logoLayout').addEventListener('change', (e) => { prev.logoLayout = e.target.value; previewChanged(); });
  $('apply').addEventListener('click', async () => {
    $('apply').disabled = true;
    const patch = {};
    for (const k of changed()) {
      if (k === 'mapid') patch.station = { mapid: prev.mapid };
      else if (k === 'logoLayout') patch.baseballLayout = prev[k];
      else patch[k] = prev[k];
    }
    const r = await fetch('api/state?b=' + encodeURIComponent(board), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(patch),
    });
    if (r.ok) { const b = await r.json(); boardCfg = { mapid: b.station.mapid, showHeader: b.showHeader, showWeather: b.showWeather, radarTime: b.radarTime !== false, logoLayout: b.baseballLayout || 'classic' }; syncPicker(); poll(); }
    else { setStatus('could not update the board'); syncPicker(); }
  });

  // ---- test alerts ----
  const TEST_LINES = { RD: '#c60c30', BL: '#00a1de', BR: '#62361b', GR: '#009b3a', OR: '#f9461c', PR: '#522398', PK: '#e27ea6', YL: '#f9e300' };
  let test = { lines: [], warn: null, game: null, radar: null, left: 0 };
  function renderTest() {
    for (const b of $('testLines').children) {
      const on = test.lines.includes(b.dataset.ln);
      b.setAttribute('aria-pressed', String(on));
      b.style.background = on ? TEST_LINES[b.dataset.ln] : '';
    }
    $('testWarn').value = test.warn ? `${test.warn.kind}:${test.warn.lvl}` : '';
    $('testGame').value = test.game || '';
    $('testRadar').value = test.radar || '';
    $('testLeft').textContent = test.left > 0 ? `clears in ${Math.ceil(test.left / 60)} min` : '';
  }
  async function setTest(next) {
    const r = await fetch('api/test?b=' + encodeURIComponent(board), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(next),
    });
    if (r.ok) { test = await r.json(); renderTest(); poll(); } else setStatus('could not set test alerts');
  }
  $('testLines').replaceChildren(...Object.keys(TEST_LINES).map((ln) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.dataset.ln = ln; b.textContent = ln; b.title = `Fake a major alert on ${ln}`;
    b.onclick = () => setTest({ ...test, lines: test.lines.includes(ln) ? test.lines.filter((x) => x !== ln) : [...test.lines, ln] });
    return b;
  }));
  $('testWarn').addEventListener('change', (e) => {
    const [kind, lvl] = e.target.value.split(':');
    setTest({ ...test, warn: kind ? { kind, lvl } : null });
  });
  $('testGame').addEventListener('change', (e) => setTest({ ...test, game: e.target.value || null }));
  $('testRadar').addEventListener('change', (e) => setTest({ ...test, radar: e.target.value || null }));
  $('testClear').addEventListener('click', () => setTest({ lines: [], warn: null, game: null, radar: null }));
  const pollTest = () => fetch('api/test?b=' + encodeURIComponent(board), { cache: 'no-store' }).then((r) => r.json()).then((t) => { test = t; renderTest(); }).catch(() => {});
  pollTest();
  setInterval(pollTest, 15000);

  await loadStations().catch((e) => setStatus('stations failed: ' + e.message));
  await poll();
  setInterval(poll, 5000);
  requestAnimationFrame(loop);
})().catch((e) => {
  document.getElementById('status').textContent = 'simulator failed: ' + e.message;
  document.getElementById('status').className = 'err';
});
</script>
</body>
</html>
