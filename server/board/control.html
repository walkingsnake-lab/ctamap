<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Board">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0b0b0b">
<title>Board</title>
<style>
  :root { color-scheme: dark; --bg: #0b0b0b; --card: #141414; --fg: #e4e4e4; --muted: #8f8f8f; --line: #262626; --accent: #ffb000; --err: #ff6b6b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
  main { max-width: 520px; margin: 0 auto; padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0; }
  header a { color: var(--muted); font-size: 14px; }
  .preview { display: block; width: 100%; aspect-ratio: 2 / 1; border-radius: 8px; border: 1px solid var(--line); background: #080808; image-rendering: pixelated; }
  .caption { color: var(--muted); font-size: 13px; margin: 6px 2px 0; min-height: 18px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 14px; }
  h2 { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  .seg { display: flex; border: 1px solid #333; border-radius: 9px; overflow: hidden; }
  .seg button { flex: 1; padding: 10px 4px; border: 0; border-right: 1px solid #333; background: transparent; color: var(--fg); font: inherit; font-size: 15px; cursor: pointer; }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #111; font-weight: 600; }
  .seg button:disabled { color: #555; cursor: default; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; }
  .row + .row { border-top: 1px solid var(--line); }
  .hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
  select, input[type=text] { width: 100%; font: inherit; color: var(--fg); background: #0e0e0e; border: 1px solid #333; border-radius: 9px; padding: 10px; }
  input[type=text] { text-transform: uppercase; }
  label.field { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  .name { display: flex; gap: 8px; }
  .name button, .small { font: inherit; font-size: 15px; color: var(--fg); background: #222; border: 1px solid #333; border-radius: 9px; padding: 10px 14px; cursor: pointer; }
  input[type=range] { width: 100%; margin-top: 12px; accent-color: var(--accent); }
  .switch { position: relative; width: 48px; height: 28px; flex: none; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; background: #333; border-radius: 14px; transition: background .15s; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #ddd; transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(20px); }
  ul { list-style: none; margin: 10px 0 0; padding: 0; }
  li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  li .chip { width: 6px; height: 22px; border-radius: 2px; flex: none; }
  li .nm { flex: 1; text-transform: uppercase; letter-spacing: .03em; }
  li .nm small { color: var(--muted); text-transform: none; letter-spacing: 0; margin-left: 6px; }
  li input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
  li.off .nm { color: #666; }
  li button { font: inherit; font-size: 16px; width: 36px; height: 32px; color: var(--fg); background: #222; border: 1px solid #333; border-radius: 7px; cursor: pointer; }
  li button:disabled { opacity: .3; cursor: default; }
  #status { position: sticky; bottom: 12px; margin-top: 16px; padding: 10px 12px; border-radius: 9px; background: #1c1c1c; border: 1px solid #333; font-size: 14px; min-height: 20px; }
  #status:empty { display: none; }
  #status.err { color: var(--err); border-color: #5a2a2a; }
  #boardPick { margin-bottom: 4px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Board</h1>
    <a id="simLink" href="sim">Simulator</a>
  </header>
  <select id="boardPick" hidden aria-label="Board"></select>
  <img id="preview" class="preview" alt="What the board is showing">
  <p class="caption" id="caption"></p>

  <section>
    <h2>Screen</h2>
    <div class="seg" id="screen">
      <button data-v="auto">Auto</button>
      <button data-v="transit">Transit</button>
      <button data-v="ticker">Ticker</button>
      <button data-v="weather">Weather</button>
      <button data-v="baseball">Baseball</button>
    </div>
    <p class="hint" id="screenHint">Auto stays on the transit screen.</p>
    <div id="visit" hidden>
      <div class="row"><span>Show radar every</span>
        <select id="radarEvery" aria-label="Show radar every" style="width:auto">
          <option value="0">Never</option><option value="2">2 min</option><option value="3">3 min</option><option value="4">4 min</option>
          <option value="5">5 min</option><option value="6">6 min</option><option value="10">10 min</option>
          <option value="15">15 min</option><option value="20">20 min</option><option value="30">30 min</option>
        </select></div>
      <div class="row"><span>For</span>
        <select id="radarFor" aria-label="Show radar for" style="width:auto">
          <option value="30">30 sec</option><option value="45">45 sec</option><option value="60">1 min</option>
          <option value="90">90 sec</option><option value="120">2 min</option><option value="180">3 min</option>
        </select></div>
    </div>
  </section>

  <section>
    <h2>Brightness</h2>
    <div class="seg" id="bright">
      <button data-v="auto">Auto</button>
      <button data-v="fixed">Fixed</button>
      <button data-v="off">Off</button>
    </div>
    <input type="range" id="level" min="5" max="100" step="5" aria-label="Brightness level" hidden>
    <p class="hint" id="brightHint"></p>
  </section>

  <section>
    <h2>Station</h2>
    <select id="station" aria-label="Station"></select>
    <label class="field" for="name">Header name</label>
    <div class="name">
      <input type="text" id="name" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <button id="saveName">Save</button>
    </div>
  </section>

  <section>
    <h2>Radar (while raining)</h2>
    <div class="seg" id="radarCorner">
      <button data-v="time">Frame time</button>
      <button data-v="temp">Temperature</button>
    </div>
    <p class="hint" id="radarCornerHint"></p>
  </section>

  <section>
    <h2>Baseball screen</h2>
    <div class="seg" id="bbLayout">
      <button data-v="classic">Classic</button>
      <button data-v="logos">Logos</button>
      <button data-v="bands">Bands</button>
    </div>
    <p class="hint" id="bbLayoutHint"></p>
    <div class="row"><span>Logo brightness</span><input type="range" id="logoBright" min="10" max="100" step="5" style="width:50%"><span id="logoBrightV"></span></div>
    <div class="row"><span>Whole logo sheet</span><label><input type="file" id="logoSheet" accept="image/png" style="width:auto"></label></div>
    <div class="row"><span>One team</span>
      <select id="logoTeam" aria-label="Team" style="width:auto"></select>
      <input type="number" id="logoCrop" min="0" max="12" placeholder="crop" aria-label="Crop row (0-12, blank = default)" style="width:5em">
      <label><input type="file" id="logoOne" accept="image/*" style="width:auto"></label>
    </div>
    <p class="hint" id="logoStatus"></p>
  </section>

  <section>
    <h2>Transit screen</h2>
    <div class="row"><span>Transit header (station + clock)</span><label class="switch"><input type="checkbox" id="showHeader"><span></span></label></div>
    <div class="row"><span>Weather row</span><label class="switch"><input type="checkbox" id="showWeather"><span></span></label></div>
    <p class="hint" id="rowsHint"></p>
  </section>

  <section>
    <h2>Destinations</h2>
    <div class="row"><span>All destinations</span><label class="switch"><input type="checkbox" id="allDest"><span></span></label></div>
    <ul id="dests"></ul>
    <p class="hint" id="destHint"></p>
  </section>

  <div id="status" role="status"></div>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const enc = encodeURIComponent;
  const LINE = { RD: '#c60c30', BL: '#00a1de', BR: '#62361b', GR: '#009b3a', OR: '#f9461c', PR: '#522398', PK: '#e27ea6', YL: '#f9e300' };
  const LINE_NAME = { RD: 'Red', BL: 'Blue', BR: 'Brown', GR: 'Green', OR: 'Orange', PR: 'Purple', PK: 'Pink', YL: 'Yellow' };
  const params = new URLSearchParams(location.search);
  let boardId = params.get('b') || 'home';
  let board = null, stations = [], dests = [], hasWx = false, hidden = [];

  let statusTimer = null;
  function setStatus(msg, err) {
    clearTimeout(statusTimer);
    $('status').textContent = msg || '';
    $('status').className = err ? 'err' : '';
    if (msg && !err) statusTimer = setTimeout(() => setStatus(''), 4000);
  }

  async function api(path, opts) {
    const r = await fetch(path, { cache: 'no-store', ...opts });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.detail || body.err || `HTTP ${r.status}`);
    return body;
  }

  async function save(patch) {
    setStatus('Saving…');
    try {
      const before = board && board.station.mapid;
      board = await api('api/state?b=' + enc(boardId), {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(patch),
      });
      if (board.station.mapid !== before) await loadDests();
      render();
      setStatus('Saved. The board picks it up within about 15 seconds.');
      refreshPreview();
    } catch (e) {
      render();
      setStatus(e.message, true);
    }
  }

  // Same rule as the board: radar visits on the auto screen while it rains.
  function visitScreen(p) {
    const r = p.radar, v = r && r.visit;
    if (p.screen !== 'transit' || !r || !r.on || !v) return p.screen;
    return Math.floor(p.now) % v.every < v.for ? 'weather' : 'transit';
  }

  // ---- preview ----
  async function refreshPreview() {
    try {
      const p = await api('api/update?b=' + enc(boardId));
      const h = p.hidden || [];
      if (hasWx !== !!p.wx || h.join() !== hidden.join()) { hasWx = !!p.wx; hidden = h; render(); }
      const img = new Image();
      img.onload = () => { $('preview').src = img.src; };
      img.src = `sim.png?b=${enc(boardId)}&scale=8&t=${Date.now()}`;
      const scr = visitScreen(p);
      const shown = scr === 'transit' && p.view === 'chrono' ? 'transit (one train per row)' : scr;
      $('caption').textContent = `Showing ${shown} · data ${p.age}s old`;
    } catch (e) {
      $('caption').textContent = 'Preview unavailable: ' + e.message;
    }
  }

  // ---- render ----
  function pressed(group, value) {
    for (const b of $(group).querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.v === value));
  }

  // The weather row only takes space when there's weather to show.
  function maxRows() { return (board.showHeader ? 4 : 5) - (board.showWeather && hasWx ? 2 : 0); }

  function render() {
    if (!board) return;
    pressed('screen', board.screen);
    const auto = board.screen === 'auto';
    $('visit').hidden = !auto;
    $('radarEvery').value = String(board.radarEvery || 0);
    $('radarFor').value = String(board.radarFor || 60);
    $('screenHint').textContent = !auto ? (board.screen === 'weather' ? 'Current weather; switches to the radar loop while rain is nearby.' : 'Stays on this screen until you change it.')
      : board.radarEvery ? `Stays on transit (baseball during Cubs and postseason games). While it's raining, the radar shows for ${$('radarFor').selectedOptions[0].text} every ${board.radarEvery} min.`
      : 'Stays on transit (baseball during Cubs and postseason games). Pick a time below to have the radar drop in while it\'s raining.';
    const fixed = Number.isInteger(board.bright);
    pressed('bright', fixed ? 'fixed' : board.bright);
    $('level').hidden = !fixed;
    if (fixed) $('level').value = board.bright;
    $('brightHint').textContent = board.bright === 'auto' ? 'Full from sunrise to sunset, 40% at night.'
      : fixed ? `${board.bright}%` : 'Panel off until you change this or the board restarts.';
    $('station').value = board.station.mapid;
    if (document.activeElement !== $('name')) $('name').value = board.station.name;
    $('showHeader').checked = board.showHeader;
    $('showWeather').checked = board.showWeather;
    const bl = board.baseballLayout || 'classic';
    pressed('bbLayout', bl);
    $('logoBright').value = board.logoBright || 90;
    $('logoBrightV').textContent = `${board.logoBright || 90}%`;
    $('bbLayoutHint').textContent = bl === 'logos'
      ? 'Team logo bands from your uploaded sheet; teams without a logo get a plain team-color band.'
      : bl === 'bands' ? 'Team-color bands with abbreviations and drop-shadowed scores, no logos.'
      : 'Team color blocks and abbreviations.';
    pressed('radarCorner', board.radarTime !== false ? 'time' : 'temp');
    $('radarCornerHint').textContent = board.radarTime !== false
      ? 'The radar frame\'s time, with AM/PM and any weather warning icon under it.'
      : 'Current weather icon and temperature; a weather watch or warning shows at the bottom right.';
    $('rowsHint').textContent = 'These are the most the board shows. When more destinations are running than fit, '
      + 'it hides the weather row first, then the header (up to 5 rows). Past 5, it lists one train per row with the header and no weather row.'
      + (hidden.length ? ` Hidden right now: ${hidden.join(' and ')}.` : '');
    renderDests();
  }

  function renderDests() {
    const all = !board.rows.length;
    $('allDest').checked = all;
    const chosen = board.rows;
    const order = all ? dests.map((d) => d.key) : [...chosen, ...dests.map((d) => d.key).filter((k) => !chosen.includes(k))];
    const byKey = new Map(dests.map((d) => [d.key, d]));
    const items = order.map((key) => {
      const d = byKey.get(key) || { key, ln: key.split(':')[0], name: key.slice(key.indexOf(':') + 1), live: 0 };
      const on = all || chosen.includes(key);
      const li = document.createElement('li');
      if (!on) li.className = 'off';
      const box = document.createElement('input');
      box.type = 'checkbox'; box.checked = on; box.disabled = all || (on && chosen.length === 1);
      box.setAttribute('aria-label', `Show ${d.name}`);
      box.onchange = () => save({ rows: box.checked ? [...chosen, key] : chosen.filter((k) => k !== key) });
      const chip = document.createElement('span');
      chip.className = 'chip'; chip.style.background = LINE[d.ln] || '#888';
      const nm = document.createElement('span');
      nm.className = 'nm'; nm.textContent = d.name;
      const sub = document.createElement('small');
      sub.textContent = LINE_NAME[d.ln] + (d.live ? '' : ' · none now');
      nm.append(sub);
      li.append(box, chip, nm);
      if (!all && on) {
        const i = chosen.indexOf(key);
        const move = (dir) => { const r = [...chosen]; [r[i], r[i + dir]] = [r[i + dir], r[i]]; save({ rows: r }); };
        const up = document.createElement('button'); up.textContent = '↑'; up.disabled = i === 0; up.setAttribute('aria-label', 'Move up'); up.onclick = () => move(-1);
        const dn = document.createElement('button'); dn.textContent = '↓'; dn.disabled = i === chosen.length - 1; dn.setAttribute('aria-label', 'Move down'); dn.onclick = () => move(1);
        li.append(up, dn);
      }
      return li;
    });
    $('dests').replaceChildren(...items);
    $('destHint').textContent = all
      ? 'Every destination, in line order. Turn this off to pick which ones show and their order.'
      : 'Only checked destinations show, in this order. Unusual destinations (reroutes) still appear after them.';
  }

  async function loadDests() {
    dests = await api(`api/destinations?b=${enc(boardId)}&mapid=${enc(board.station.mapid)}`);
  }

  // ---- events ----
  $('screen').addEventListener('click', (e) => { const v = e.target.dataset.v; if (v && !e.target.disabled) save({ screen: v }); });
  $('radarEvery').addEventListener('change', (e) => save({ radarEvery: Number(e.target.value) }));
  $('radarFor').addEventListener('change', (e) => save({ radarFor: Number(e.target.value) }));
  $('bright').addEventListener('click', (e) => {
    const v = e.target.dataset.v; if (!v) return;
    save({ bright: v === 'fixed' ? (Number.isInteger(board.bright) ? board.bright : 60) : v });
  });
  $('level').addEventListener('change', (e) => save({ bright: Number(e.target.value) }));
  $('station').addEventListener('change', (e) => save({ station: { mapid: e.target.value } }));
  const saveName = () => save({ station: { mapid: board.station.mapid, name: $('name').value } });
  $('saveName').addEventListener('click', saveName);
  $('name').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('name').blur(); saveName(); } });
  $('showHeader').addEventListener('change', (e) => save({ showHeader: e.target.checked }));
  $('showWeather').addEventListener('change', (e) => save({ showWeather: e.target.checked }));
  $('bbLayout').addEventListener('click', (e) => { const v = e.target.dataset.v; if (v) save({ baseballLayout: v }); });
  $('logoBright').addEventListener('input', (e) => { $('logoBrightV').textContent = `${e.target.value}%`; });
  $('logoBright').addEventListener('change', (e) => save({ logoBright: Number(e.target.value) }));
  const TEAMS = ['AZ', 'ATH', 'ATL', 'BAL', 'BOS', 'CHC', 'CIN', 'CLE', 'COL', 'CWS', 'DET', 'HOU', 'KC', 'LAA', 'LAD', 'MIA', 'MIL', 'MIN', 'NYM', 'NYY', 'PHI', 'PIT', 'SD', 'SEA', 'SF', 'STL', 'TB', 'TEX', 'TOR', 'WSH'];
  $('logoTeam').replaceChildren(...TEAMS.map((t) => new Option(t, t)));
  async function loadLogoStatus() {
    try {
      const s = await api('api/logos');
      const n = (s.teams || []).length;
      $('logoStatus').textContent = n
        ? `${n} of 30 team logos, last change ${new Date(s.updated * 1000).toLocaleString()}. Logos are only resized and cropped; they stay on the server, not in the repo.`
        : 'No logos yet. Upload the 5 x 6 sheet of 32px tiles (any whole-number scale), or one team at a time.';
    } catch (e) { $('logoStatus').textContent = e.message; }
  }
  // Any image -> PNG (phones hand over JPEG/HEIC-as-JPEG), at most 256px.
  async function asPng(file) {
    if (file.type === 'image/png') return file;
    const img = await createImageBitmap(file);
    const k = Math.min(1, 256 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return new Promise((res) => c.toBlob(res, 'image/png'));
  }
  async function uploadLogo(file, query) {
    setStatus('Uploading logo…');
    try {
      await api('api/logos' + query, { method: 'POST', headers: { 'Content-Type': 'image/png' }, body: await asPng(file) });
      setStatus('Logos updated.');
      await loadLogoStatus();
      refreshPreview();
    } catch (err) { setStatus(err.message, true); }
  }
  $('logoSheet').addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if (file) await uploadLogo(file, '');
    e.target.value = '';
  });
  $('logoOne').addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    const crop = $('logoCrop').value;
    if (file) await uploadLogo(file, `?team=${enc($('logoTeam').value)}${crop !== '' ? `&crop=${enc(crop)}` : ''}`);
    e.target.value = '';
  });
  loadLogoStatus();
  $('radarCorner').addEventListener('click', (e) => { const v = e.target.dataset.v; if (v) save({ radarTime: v === 'time' }); });
  $('allDest').addEventListener('change', (e) => save({ rows: e.target.checked ? [] : dests.map((d) => d.key) }));
  $('boardPick').addEventListener('change', (e) => {
    boardId = e.target.value;
    const q = new URLSearchParams(location.search); q.set('b', boardId);
    location.search = q;
  });

  // ---- start ----
  async function init() {
    $('simLink').href = 'sim?b=' + enc(boardId);
    const [all, list] = await Promise.all([api('api/state'), api('api/stations')]);
    stations = list;
    $('station').replaceChildren(...stations.map((s) => new Option(s.desc, s.mapid)));
    const ids = Object.keys(all.boards || {});
    if (ids.length > 1) {
      $('boardPick').hidden = false;
      $('boardPick').replaceChildren(...ids.map((id) => new Option(`Board: ${id}`, id)));
      $('boardPick').value = boardId;
    }
    board = all.boards[boardId];
    if (!board) { setStatus(`No board named "${boardId}".`, true); return; }
    await loadDests();
    render();
    refreshPreview();
    setInterval(refreshPreview, 10000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshPreview(); });
  }
  init().catch((e) => setStatus('Could not load: ' + e.message, true));
})();
</script>
</body>
</html>
